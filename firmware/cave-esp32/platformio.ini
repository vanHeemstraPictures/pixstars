; Pixstars cave ESP32 firmware
; Bridges Mac Mini OSC commands (WiFi/UDP) to lamp cave hardware:
;   Maestro servos, AX-12A head nod, WS2812 LED ring, TMC2209 turntable stepper.
;
; Board: ESP32 DevKit (ESP32-WROOM-32)
; Framework: Arduino
;
; Build with: pio run
; Upload with: pio run -t upload
; Monitor: pio device monitor

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    https://github.com/CNMAT/OSC.git

build_flags =
    -DCORE_DEBUG_LEVEL=3
