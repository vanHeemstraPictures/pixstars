; Pixstars cave ESP32 firmware
; Bridges Mac Mini OSC commands (WiFi/UDP) to lamp cave hardware:
;   Maestro servos, AX-12A head nod, WS2812 LED ring, TMC2209 turntable stepper.
;
; Board: ESP32-S3-DevKitC-1 with ESP32-S3-WROOM-1-N16R8 module
;        (16 MB QIO flash, 8 MB octal PSRAM, addressable RGB LED on GPIO 48)
; Framework: Arduino
;
; Build with: pio run
; Upload with: pio run -t upload
; Monitor: pio device monitor

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    https://github.com/CNMAT/OSC.git

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1
