<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1120" width="1400" height="1120" font-family="Helvetica, Arial, sans-serif">
  <title>AX-12A external read via U2D2 -- temporary, read-only wiring (single-TTL U2D2)</title>
  <desc>Temporary U2D2 TTL bench-read topology for AX-12A. Real U2D2 has one 3-pin TTL, one 4-pin RS-485, one UART header, and USB-C. TTL is the sole comm port. Pattern A (preferred) uses the AX-12A daisy-chain; Pattern B (fallback) uses a breadboard 3-way junction. ESP32/74HCT245 DATA path is isolated during the read. Pin order and conductor colors on this diagram mirror the bench-proven wiring in ax-12a-bench-test.svg (Dynamixel Wizard 2.0: Protocol 1.0, 1000000 bps, ID 1, model AX-12A). Straight ASCII quotes only.</desc>
  <style>
    .title{font-size:22px;font-weight:bold;fill:#111}
    .subtitle{font-size:14px;fill:#444}
    .box{fill:#fff;stroke:#222;stroke-width:2}
    .partname{font-size:16px;font-weight:bold;fill:#111}
    .label{font-size:13px;fill:#111}
    .small{font-size:12px;fill:#333}
    .tiny{font-size:11px;fill:#555}
    .pin{fill:#fafafa;stroke:#222;stroke-width:1}
    .pintxt{font-size:10px;fill:#111;text-anchor:middle}
    .wire12{stroke:#fa7307;stroke-width:5;fill:none}
    .gnd{stroke:#111;stroke-width:4;fill:none}
    .data{stroke:#f6f208;stroke-width:5;fill:none}
    .p5v{stroke:#f50b26;stroke-width:3;fill:none;stroke-dasharray:6 4}
    .usblive{stroke:#444;stroke-width:3;fill:none}
    .unused{fill:#f4f4f4;stroke:#999;stroke-width:1.5;stroke-dasharray:6 4}
    .unusedTxt{font-size:12px;fill:#888;font-style:italic}
    .hazard{fill:#fff0f0;stroke:#a00;stroke-width:2}
    .hazardTxt{font-size:12px;fill:#a00;font-weight:bold}
    .isolated{fill:#efefef;stroke:#888;stroke-width:2;stroke-dasharray:10 6}
    .isolatedTxt{font-size:12px;fill:#666}
    .callout{fill:#fffbe6;stroke:#b58900;stroke-width:1.5}
    .warn{font-size:13px;fill:#7a5a00}
    .strike{stroke:#c00;stroke-width:3;fill:none}
    .netdot{fill:#111}
    .cableLbl{font-size:12px;fill:#333;font-style:italic}
    .patternBox{fill:#f7faff;stroke:#3355aa;stroke-width:2}
    .patternTitle{font-size:14px;font-weight:bold;fill:#223a70}
  </style>

  <!-- Header -->
  <text x="20" y="34" class="title">AX-12A external read via U2D2 -- temporary, read-only</text>
  <text x="20" y="56" class="subtitle">Real U2D2: ONE 3-pin TTL + ONE 4-pin RS-485 + ONE UART header + USB-C. TTL is the sole AX-12A comm path. UART OFF-LIMITS. RS-485 unused. ESP32 / 74HCT245 DATA path isolated for the duration of the read.</text>
  <text x="20" y="76" class="subtitle">Pin order and conductor colors below mirror the bench-proven wiring in ax-12a-bench-test.svg (Wizard scan OK: Protocol 1.0, 1000000 bps, ID 1, AX-12A).</text>

  <!-- ============ Mac Mini ============ -->
  <g id="macmini">
    <rect x="40" y="100" width="170" height="90" rx="10" class="box"/>
    <text x="125" y="130" text-anchor="middle" class="partname">Mac Mini M4 Pro</text>
    <text x="125" y="150" text-anchor="middle" class="small">Dynamixel Wizard 2.0</text>
    <text x="125" y="168" text-anchor="middle" class="tiny">/dev/cu.usbserial-*</text>
    <rect x="200" y="135" width="18" height="14" class="pin"/>
    <text x="209" y="130" class="tiny" text-anchor="middle">USB-C</text>
  </g>

  <!-- ============ U2D2 (single TTL, single RS-485, single UART, USB-C) ============ -->
  <g id="u2d2">
    <rect x="440" y="100" width="420" height="330" rx="8" class="box"/>
    <text x="650" y="128" text-anchor="middle" class="partname">ROBOTIS U2D2</text>
    <text x="650" y="146" text-anchor="middle" class="small">USB &lt;-&gt; TTL half-duplex (Protocol 1.0). Does NOT supply 12V.</text>

    <!-- USB-C port on left side (host link only) -->
    <rect x="422" y="200" width="20" height="16" class="pin"/>
    <text x="432" y="228" class="tiny" text-anchor="middle">USB-C</text>
    <text x="432" y="244" class="tiny" text-anchor="middle">(to Mac Mini)</text>

    <!-- SINGLE TTL 3-pin socket (JST EHR-03) -->
    <g id="ttl">
      <rect x="580" y="180" width="170" height="80" class="box"/>
      <text x="665" y="200" text-anchor="middle" class="label">TTL 3-pin (JST EHR-03)</text>
      <text x="665" y="216" text-anchor="middle" class="tiny">sole AX-12A comm port</text>
      <rect x="595" y="226" width="26" height="24" class="pin"/><text x="608" y="242" class="pintxt">1</text>
      <rect x="649" y="226" width="26" height="24" class="pin"/><text x="662" y="242" class="pintxt">2</text>
      <rect x="703" y="226" width="26" height="24" class="pin"/><text x="716" y="242" class="pintxt">3</text>
      <text x="608" y="270" class="tiny" text-anchor="middle">GND</text>
      <text x="662" y="270" class="tiny" text-anchor="middle">VDD</text>
      <text x="716" y="270" class="tiny" text-anchor="middle">DATA</text>
      <text x="665" y="286" text-anchor="middle" class="tiny" fill="#155">order matches bench-proven ax-12a-bench-test.svg</text>
    </g>

    <!-- RS-485 4-pin : UNUSED -->
    <g id="rs485">
      <rect x="460" y="325" width="180" height="80" class="unused"/>
      <text x="550" y="345" text-anchor="middle" class="label">RS-485 4-pin (JST EHR-04)</text>
      <text x="550" y="363" text-anchor="middle" class="unusedTxt">UNUSED for AX-12A</text>
      <text x="550" y="380" text-anchor="middle" class="tiny">differential D+/D- -- not compatible</text>
      <text x="550" y="395" text-anchor="middle" class="tiny">with single-ended TTL half-duplex</text>
    </g>

    <!-- UART header : OFF-LIMITS (hazard) -->
    <g id="uart">
      <rect x="670" y="325" width="170" height="80" class="hazard"/>
      <text x="755" y="345" text-anchor="middle" class="label">UART header</text>
      <text x="755" y="363" text-anchor="middle" class="hazardTxt">OFF-LIMITS -- DO NOT WIRE</text>
      <text x="755" y="380" text-anchor="middle" class="tiny">FTDI 3.3V TX/RX bridge. +12V here</text>
      <text x="755" y="395" text-anchor="middle" class="tiny">destroys the U2D2 (not reversible).</text>
    </g>
  </g>

  <!-- USB Mac Mini -> U2D2 -->
  <path d="M218,142 C 320,142 340,208 422,208" class="usblive"/>
  <text x="240" y="130" class="tiny">USB-C host link (Mac Mini &lt;-&gt; U2D2 only)</text>

  <!-- ============ AX-12A servo with TWO daisy-chain sockets (Pattern A uses both) ============ -->
  <g id="ax12a">
    <rect x="1030" y="100" width="330" height="300" rx="6" class="box"/>
    <text x="1195" y="128" text-anchor="middle" class="partname">Dynamixel AX-12A</text>
    <text x="1195" y="148" text-anchor="middle" class="small">head-nod servo -- two 3-pin sockets,</text>
    <text x="1195" y="164" text-anchor="middle" class="small">internally wired in parallel (daisy-chain)</text>

    <!-- Socket #1 (left / PSU feed in Pattern A) -->
    <g id="ax_s1">
      <rect x="1050" y="185" width="130" height="90" class="box"/>
      <text x="1115" y="203" text-anchor="middle" class="label">Socket #1</text>
      <text x="1115" y="219" text-anchor="middle" class="tiny">PSU feed (Pattern A)</text>
      <rect x="1060" y="225" width="22" height="22" class="pin"/><text x="1071" y="241" class="pintxt">1</text>
      <rect x="1104" y="225" width="22" height="22" class="pin"/><text x="1115" y="241" class="pintxt">2</text>
      <rect x="1148" y="225" width="22" height="22" class="pin"/><text x="1159" y="241" class="pintxt">3</text>
      <text x="1071" y="264" class="tiny" text-anchor="middle">GND</text>
      <text x="1115" y="264" class="tiny" text-anchor="middle">+12V</text>
      <text x="1159" y="264" class="tiny" text-anchor="middle">DATA*</text>
    </g>

    <!-- Socket #2 (right / U2D2 comm in Pattern A) -->
    <g id="ax_s2">
      <rect x="1210" y="185" width="130" height="90" class="box"/>
      <text x="1275" y="203" text-anchor="middle" class="label">Socket #2</text>
      <text x="1275" y="219" text-anchor="middle" class="tiny">U2D2 comm (Pattern A)</text>
      <rect x="1220" y="225" width="22" height="22" class="pin"/><text x="1231" y="241" class="pintxt">1</text>
      <rect x="1264" y="225" width="22" height="22" class="pin"/><text x="1275" y="241" class="pintxt">2</text>
      <rect x="1308" y="225" width="22" height="22" class="pin"/><text x="1319" y="241" class="pintxt">3</text>
      <text x="1231" y="264" class="tiny" text-anchor="middle">GND</text>
      <text x="1275" y="264" class="tiny" text-anchor="middle">+12V</text>
      <text x="1319" y="264" class="tiny" text-anchor="middle">DATA</text>
    </g>

    <!-- Internal parallel line between the two AX-12A sockets -->
    <path d="M1115,275 L1115,290 L1275,290 L1275,275" stroke="#666" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>
    <text x="1195" y="308" text-anchor="middle" class="tiny">the two sockets are wired internally in parallel (daisy-chain)</text>

    <!-- DATA* note -->
    <text x="1195" y="340" text-anchor="middle" class="tiny">*Cable X leaves the socket-#1 DATA pin UNWIRED at the breadboard end</text>
    <text x="1195" y="356" text-anchor="middle" class="tiny">(no wire on the AX-12A DATA rail beside the pigtail); DATA reaches the</text>
    <text x="1195" y="372" text-anchor="middle" class="tiny">servo through socket #2 via Cable Y from the U2D2 TTL socket.</text>
  </g>

  <!-- ============ Bench PSU + breadboard rails ============ -->
  <g id="psu">
    <rect x="40" y="900" width="170" height="90" rx="6" class="box"/>
    <text x="125" y="928" text-anchor="middle" class="partname">MEAN WELL LRS-50-12</text>
    <text x="125" y="947" text-anchor="middle" class="small">bench 12V supply</text>
    <text x="80" y="972" class="tiny">V+</text>
    <text x="160" y="972" class="tiny">V-</text>
  </g>
  <!-- +12V rail (orange bar) -->
  <rect x="210" y="926" width="820" height="6" fill="#e07a1a"/>
  <text x="230" y="920" class="tiny">breadboard +12V rail (orange)</text>
  <!-- GND rail (black bar) -->
  <rect x="210" y="960" width="820" height="6" fill="#111"/>
  <text x="230" y="985" class="tiny">breadboard GND rail (black) -- single continuous net</text>

  <!-- ============ Isolated ESP32 / 74HCT245 block ============ -->
  <g id="isolated">
    <rect x="40" y="470" width="410" height="320" rx="8" class="isolated"/>
    <text x="245" y="494" text-anchor="middle" class="partname" fill="#555">ESP32 / 74HCT245 -- ISOLATED</text>
    <text x="245" y="512" text-anchor="middle" class="isolatedTxt">no wire from this block to the U2D2 or to the AX-12A DATA pin</text>

    <!-- ESP32 -->
    <g id="esp32">
      <rect x="60" y="530" width="170" height="130" class="box" opacity="0.9"/>
      <text x="145" y="552" text-anchor="middle" class="partname" fill="#555">ESP32-S3</text>
      <text x="145" y="570" text-anchor="middle" class="small">USB-C UNPLUGGED</text>
      <text x="145" y="588" text-anchor="middle" class="tiny">unpowered during</text>
      <text x="145" y="602" text-anchor="middle" class="tiny">the external read</text>
      <text x="145" y="622" text-anchor="middle" class="tiny">GPIO15 TX -&gt; A1</text>
      <text x="145" y="636" text-anchor="middle" class="tiny">GPIO16 &lt;- A2 (via divider)</text>
      <text x="145" y="650" text-anchor="middle" class="tiny">GPIO8 DIR -&gt; pin 1</text>
    </g>
    <!-- ESP32 USB unplugged marker on its left -->
    <rect x="44" y="560" width="16" height="12" class="pin"/>
    <line x1="40" y1="556" x2="64" y2="576" class="strike"/>
    <line x1="64" y1="556" x2="40" y2="576" class="strike"/>

    <!-- 74HCT245 -->
    <g id="hct245">
      <rect x="260" y="530" width="180" height="130" class="box" opacity="0.9"/>
      <text x="350" y="552" text-anchor="middle" class="partname" fill="#555">74HCT245</text>
      <text x="350" y="570" text-anchor="middle" class="small">half-duplex buffer</text>
      <text x="350" y="590" text-anchor="middle" class="tiny">VCC = +5V (cave rail)</text>
      <text x="350" y="606" text-anchor="middle" class="tiny">A1/A2 &lt;-&gt; ESP32</text>
      <text x="350" y="622" text-anchor="middle" class="tiny">B1 &amp; B2 bridged</text>
      <text x="350" y="638" text-anchor="middle" class="tiny">(normally to AX-12A DATA)</text>
    </g>
    <!-- ESP32 <-> 74HCT245 internal wires -->
    <path d="M230,622 L260,622" stroke="#888" stroke-width="1.5" fill="none"/>
    <path d="M230,636 L260,636" stroke="#888" stroke-width="1.5" fill="none"/>
    <path d="M230,650 L260,650" stroke="#888" stroke-width="1.5" fill="none"/>

    <!-- Dangling B1/B2 bridge that does NOT reach AX-12A DATA -->
    <path d="M440,622 L470,622" stroke="#888" stroke-width="2" fill="none"/>
    <line x1="462" y1="614" x2="478" y2="630" class="strike"/>
    <line x1="478" y1="614" x2="462" y2="630" class="strike"/>
    <text x="245" y="685" text-anchor="middle" class="warn">B1/B2 bridge is NOT connected to AX-12A DATA during the read</text>
    <text x="245" y="705" text-anchor="middle" class="warn">choose ONE: pull AX-12A pigtail from breadboard socket,</text>
    <text x="245" y="721" text-anchor="middle" class="warn">or pull the yellow DATA jumper on the header</text>
    <text x="245" y="742" text-anchor="middle" class="isolatedTxt">(one is enough -- do not do both cosmetically)</text>
    <text x="245" y="760" text-anchor="middle" class="isolatedTxt">+5V (cave) feeds ONLY the 74HCT245 -- NOT shared with the U2D2</text>
    <text x="245" y="778" text-anchor="middle" class="isolatedTxt">GND rail below is still tied to this block (single continuous net)</text>
  </g>

  <!-- ============ Pattern A wiring (main diagram) ============ -->
  <!-- Cable X: breadboard rails -> AX-12A socket #1 (GND + +12V only, DATA left unwired) -->
  <!-- +12V: PSU V+ -> +12V rail -->
  <path d="M120,966 L120,929" class="wire12"/>
  <circle cx="120" cy="929" r="4" class="netdot"/>
  <!-- +12V rail -> AX-12A socket #1 pin 2 (Cable X, +12V conductor) -->
  <path d="M1000,929 L1000,300 L1115,300 L1115,247" class="wire12"/>
  <circle cx="1000" cy="929" r="4" class="netdot"/>
  <text x="1006" y="500" class="cableLbl" fill="#7a4a10">Cable X (PSU feed)</text>
  <text x="1006" y="516" class="cableLbl" fill="#7a4a10">+12V + GND only</text>

  <!-- GND: PSU V- -> GND rail -->
  <path d="M160,966 L160,963" class="gnd"/>
  <!-- GND rail -> AX-12A socket #1 pin 1 (Cable X, GND conductor) -->
  <path d="M980,963 L980,320 L1071,320 L1071,247" class="gnd"/>
  <circle cx="980" cy="963" r="4" class="netdot"/>
  <!-- GND continuous into isolated block -->
  <path d="M300,963 L300,790" class="gnd"/>
  <circle cx="300" cy="963" r="4" class="netdot"/>
  <text x="308" y="808" class="tiny" fill="#666">GND is shared -- one continuous net</text>

  <!-- +12V pass-through into U2D2 TTL VDD via Cable Y (shown at right side of U2D2) -->
  <!-- Cable Y: U2D2 TTL (pins 1/2/3) -> AX-12A socket #2 (pins 1/2/3) -->
  <!-- GND conductor -->
  <path d="M608,250 L608,460 L1231,460 L1231,247" class="gnd"/>
  <!-- +12V conductor -->
  <path d="M662,250 L662,445 L1275,445 L1275,247" class="wire12"/>
  <!-- DATA conductor -->
  <path d="M716,250 L716,430 L1319,430 L1319,247" class="data"/>
  <text x="820" y="422" class="cableLbl" fill="#333">Cable Y (comm cable) -- GND + +12V + DATA, all three conductors</text>

  <!-- Explicit annotation: AX-12A socket #1 DATA pin is intentionally unwired -->
  <circle cx="1159" cy="238" r="14" fill="none" stroke="#c00" stroke-width="2"/>
  <text x="1159" y="292" text-anchor="middle" class="tiny" fill="#a00">socket #1 DATA pin:</text>
  <text x="1159" y="306" text-anchor="middle" class="tiny" fill="#a00">not wired externally</text>

  <!-- ============ Pattern B inset (fallback: breadboard 3-way junction) ============ -->
  <g id="patternB">
    <rect x="470" y="500" width="410" height="240" rx="8" class="patternBox"/>
    <text x="675" y="524" text-anchor="middle" class="patternTitle">Pattern B (fallback) -- breadboard 3-way junction</text>
    <text x="675" y="542" text-anchor="middle" class="small">Use only if the AX-12A's second socket cannot be used.</text>
    <text x="675" y="558" text-anchor="middle" class="small">Electrically equivalent to Pattern A; adds a short DATA stub.</text>

    <!-- Junction (3 rows) -->
    <rect x="620" y="580" width="110" height="90" fill="#fff" stroke="#3355aa" stroke-width="1.5"/>
    <text x="675" y="597" text-anchor="middle" class="tiny">breadboard junction</text>
    <rect x="635" y="605" width="80" height="14" fill="#111" opacity="0.85"/><text x="740" y="616" class="tiny">row 1: GND</text>
    <rect x="635" y="623" width="80" height="14" fill="#e07a1a"/><text x="740" y="634" class="tiny">row 2: +12V</text>
    <rect x="635" y="641" width="80" height="14" fill="#eab308"/><text x="740" y="652" class="tiny">row 3: DATA</text>

    <!-- U2D2 TTL cable end into junction -->
    <text x="500" y="616" class="tiny">U2D2 TTL 3-pin</text>
    <text x="500" y="630" class="tiny">cable end</text>
    <path d="M560,612 L635,612" class="gnd"/>
    <path d="M560,630 L635,630" class="wire12"/>
    <path d="M560,648 L635,648" class="data"/>

    <!-- Jumpers from junction to rails and to AX-12A pigtail -->
    <text x="490" y="700" class="tiny">-&gt; breadboard GND rail</text>
    <text x="490" y="716" class="tiny">-&gt; breadboard +12V rail</text>
    <text x="490" y="732" class="tiny">-&gt; AX-12A pigtail DATA pin</text>
    <text x="765" y="700" class="tiny">AX-12A pigtail GND (pin 1) -&gt; GND rail</text>
    <text x="765" y="716" class="tiny">AX-12A pigtail VCC (pin 2) -&gt; +12V rail</text>
    <text x="765" y="732" class="tiny">AX-12A pigtail DATA (pin 3) -&gt; junction row 3</text>
  </g>

  <!-- ============ Legend ============ -->
  <g id="legend">
    <rect x="900" y="500" width="470" height="240" class="box"/>
    <text x="915" y="524" class="partname">Legend</text>
    <line x1="920" y1="544" x2="970" y2="544" class="wire12"/>
    <text x="980" y="548" class="small">+12V motor rail (PSU, breadboard, AX-12A, U2D2 TTL VDD pass-through)</text>
    <line x1="920" y1="568" x2="970" y2="568" class="gnd"/>
    <text x="980" y="572" class="small">GND (single continuous net, incl. Mac Mini via USB-C)</text>
    <line x1="920" y1="592" x2="970" y2="592" class="data"/>
    <text x="980" y="596" class="small">DATA TTL half-duplex -- U2D2 &lt;-&gt; AX-12A only (2 nodes)</text>
    <line x1="920" y1="616" x2="970" y2="616" class="p5v"/>
    <text x="980" y="620" class="small">+5V cave rail -- NOT shared with U2D2</text>
    <rect x="920" y="632" width="50" height="18" class="unused"/>
    <text x="980" y="646" class="small">UNUSED port (RS-485)</text>
    <rect x="920" y="656" width="50" height="18" class="hazard"/>
    <text x="980" y="670" class="small">OFF-LIMITS port (UART) -- damage hazard</text>
    <rect x="920" y="680" width="50" height="18" class="isolated"/>
    <text x="980" y="694" class="small">ISOLATED subassembly (ESP32 + 74HCT245)</text>
    <text x="915" y="722" class="warn">Read-only, bench-safe: no register writes, no firmware, no permanent rewiring.</text>
  </g>

  <!-- Footer -->
  <text x="20" y="1090" class="tiny">Source of truth for wire order and conductor colors: electronics/fritzing/ax-12a-bench-test.svg (last updated 2026-07-31 09:57, Willem van Heemstra). This diagram is the read-only, isolated-ESP32 variant of that bench topology.</text>
  <text x="20" y="1108" class="tiny">Ref: task 12dfd4d5-abfc-4768-8366-106f8de22145 (this update); prior 0330738c-d7fa-4575-9594-ec4fa16f8ab7 (original diagram); reconciled hookup model task 4183fa6b-01e5-4386-bdd7-dbf3230aff0e; procedure per readiness-pass task 581d6b5b-91a4-45b4-8aae-554ce590b9e1. Straight ASCII quotes only.</text>
</svg>

