# ============================================================================
# Pixstars - Show Timeline
# ============================================================================
# Aligned with screenplays/screenplay.md (11 scenes, ~11:45 total).
#
# Each cue may include:
#   time:       seconds from show start
#   name:       human-readable cue name
#   act:        screenplay scene number (1-11)
#   ardour:     OSC command for Ardour (optional)
#   projection: projection scene name (optional)
#   lighting:   lighting state name (optional)
#   cave:       list of ESP32 cave controller commands (optional)
#               supported cmds: head_nod, servo, led_rear, led_front,
#                               turntable_rotate, turntable_origin
#   laser:      single laser scene cmd string (placeholder, logs only)
#               examples: "LASER_SWEEP", "LASER_STICK_FIGURE",
#                         "LASER_AI_TEXT", "LASER_SIGNATURE", "BLACKOUT"
#   rain:       digital rain overlay state (sent as /projection/rain)
#               states: RAIN_OFF, RAIN_TRACES, RAIN_BUILDING, RAIN_STORM,
#                       RAIN_SHATTER, RAIN_STOP, RAIN_GENTLE, RAIN_NAMES,
#                       RAIN_THREE, RAIN_WE
#               (rain words are restricted to WALT, AXEL, A.I., WE)
#
# Head (Dynamixel AX-12A) angles: 0-300 deg, neutral = 150
#   tilt down  -> angle < 150 (e.g. 147 = 3 deg down, 135 = 15 deg down)
#   tilt up    -> angle > 150
# Servo channel map: Ch1 lower arm, Ch2 elbow, Ch3 neck pan (MG90S)
# Turntable: degrees relative to current, speed in deg/sec
# LED ring: led_rear with r/g/b (0-255) and mode (solid, pulse, flicker, off)
# ============================================================================

